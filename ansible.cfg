[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
roles_path = roles
retry_files_enabled = False
stdout_callback = default
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
# ControlMaster pour la perf + support des équipements SSH anciens (ssh-rsa/dss)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o HostKeyAlgorithms=+ssh-rsa,ssh-dss -o PubkeyAcceptedAlgorithms=+ssh-rsa
