services:
  console:
    build: .
    image: filebeat-deployer-console
    container_name: filebeat-console

    # IMPORTANT : indispensable pour scanner le LAN et joindre les hôtes en SSH.
    network_mode: host

    cap_add:
      - NET_RAW            # autorise le ping ICMP depuis le conteneur

    # Toute la config utilisateur vient de variables d'environnement :
    #   - Portainer : définies dans l'UI -> écrites dans stack.env -> chargées ici.
    #     (tu peux ajouter une variable dans Portainer sans toucher au compose,
    #      donc il reste synchro avec le repo Git.)
    #   - Local     : un fichier .env à côté du compose.
    # Les deux sont OPTIONNELS ; l'app a des valeurs par défaut internes.
    env_file:
      - path: stack.env
        required: false
      - path: .env
        required: false

    # Défauts adaptés au conteneur (la console doit écouter sur 0.0.0.0).
    # Surchargeables via les variables ci-dessus.
    environment:
      FLASK_HOST: ${FLASK_HOST:-0.0.0.0}
      FLASK_PORT: ${FLASK_PORT:-5000}
      INVENTORY_FILE: /app/data/inventory.json

    volumes:
      # Inventaire de parc + clé de la console (persistant) :
      - ./data:/app/data
      # Optionnel : clés SSH perso de l'admin (la console génère la sienne sinon)
      # - /root/.ssh:/root/.ssh:ro

    restart: unless-stopped

# Déploiement :
#   - Local     : cp .env.example .env  &&  docker compose up -d --build
#   - Portainer : déployer depuis le repo Git, définir les variables dans
#                 "Environment variables" (FILEBEAT_OUTPUT_HOST, BOOTSTRAP_USER, ...).
#   -> http://<ip-de-la-box>:5000
